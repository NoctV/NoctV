<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/>
<animate attributeName="x1" values="0;-1;0" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="ln2" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.t{animation:t 1.2s cubic-bezier(.2,.9,.3,1) both}@keyframes t{from{opacity:0;letter-spacing:22px}to{opacity:1;letter-spacing:8px}}</style></defs>
<rect x="120" y="45" width="280" height="1.2" fill="url(#ln)"/><rect x="800" y="45" width="280" height="1.2" fill="url(#ln2)"/>
<text x="600" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="8" fill="url(#g)" filter="url(#glow)" class="t">⚔ ARSENAL</text>
</svg>