<radialGradient id="core"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="ring" d="M210 210 m-150 0 a150 150 0 1 1 300 0 a150 150 0 1 1 -300 0"/>
<style>
.spin{animation:spin 40s linear infinite;transform-origin:210px 210px}@keyframes spin{to{transform:rotate(360deg)}}
.spin2{animation:spin 26s linear infinite reverse;transform-origin:210px 210px}
.wl{animation:wl 4s ease-in-out infinite;transform-origin:186px 222px}@keyframes wl{50%{transform:rotate(7deg)}}
