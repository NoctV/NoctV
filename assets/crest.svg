.pulse{animation:pulse 4s ease-in-out infinite;transform-origin:210px 210px}@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.gem{animation:gem 2.4s ease-in-out infinite}@keyframes gem{50%{fill:#f0abfc}}
</style></defs>
