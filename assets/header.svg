<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.8  0 0 0 0 0.95  0 0 0 0.22 0" in="n"/>
  <feComposite operator="in" in2="SourceGraphic"/>
</filter>
<filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="9" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="6"/></filter>
<radialGradient id="ink1" cx="22%" cy="35%" r="45%"><stop offset="0" stop-color="#1b6fa0" stop-opacity=".55"/><stop offset="1" stop-color="#1b6fa0" stop-opacity="0"/></radialGradient>
<radialGradient id="ink2" cx="78%" cy="70%" r="40%"><stop offset="0" stop-color="#25c6e6" stop-opacity=".35"/><stop offset="1" stop-color="#25c6e6" stop-opacity="0"/></radialGradient>
<linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e8f7ff"/><stop offset=".55" stop-color="#7fdcf5"/><stop offset="1" stop-color="#e8f7ff"/>
<animate attributeName="x1" values="0;-1;0" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect width="1200" height="380" fill="#04060c"/>
<rect width="1200" height="380" fill="url(#ink1)"/>
<rect width="1200" height="380" fill="url(#ink2)"/>
<g stroke="#9fd8ee" stroke-opacity=".08" stroke-width="1.2">
  <path d="M40 300 L220 120"/><path d="M160 360 L420 70"/><path d="M520 380 L700 190"/><path d="M880 340 L1120 60"/><path d="M1000 380 L1190 190"/><path d="M300 380 L380 290"/>
</g>
<!-- wings behind the name -->
<g fill="#0a1a2e" stroke="#47c8ee" stroke-opacity=".35" stroke-width="1.5" filter="url(#rough)">
  <path d="M600 210 Q430 120 250 60 Q380 150 420 190 Q330 170 230 150 Q360 210 420 230 Q340 240 270 250 Q400 270 600 230Z"/>
  <path d="M600 210 Q770 120 950 60 Q820 150 780 190 Q870 170 970 150 Q840 210 780 230 Q860 240 930 250 Q800 270 600 230Z"/>
</g>
<!-- the crosshair -->
<g stroke="#c8202e" stroke-width="3" fill="none" stroke-linecap="round" opacity=".92" filter="url(#rough)">
  <circle cx="600" cy="190" r="118"/>
  <path d="M440 192 L760 188 M598 40 L602 340"/>
  <animateTransform attributeName="transform" type="rotate" values="0 600 190;2 600 190;0 600 190;-2 600 190;0 600 190" dur="9s" repeatCount="indefinite"/>
</g>
<text x="600" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="18" fill="url(#title)">NOCTV</text>
<text x="600" y="300" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="4" fill="#9fd8ee" fill-opacity=".85">IN THIS WORLD, NOTHING IS MORE IMPORTANT THAN WINNING</text>
<g fill="#c8202e" font-family="Segoe Print, Comic Sans MS, cursive" font-size="40" font-weight="700" transform="rotate(-8 1060 70)"><text x="1030" y="80">???</text></g>
<rect width="1200" height="380" filter="url(#grain)" fill="#fff"/>
</svg>
